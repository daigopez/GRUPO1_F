<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Estado del Pedido</title>
</head>
<body>
    <h1>Actualizar Estado del Pedido #{{ pedido.id }}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Actualizar</button>
    </form>
    <a href="{% url 'lista_pedidos' %}">Volver a la lista de pedidos</a>
</body>
</html>
