<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesar Pago</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        h2 {
            color: #333;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            padding: 10px;
            background: #e2e2e2;
            border-radius: 4px;
        }
        button {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>

<h2>Procesar Pago</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <h3>Detalles de tu compra:</h3>
    <ul>
        {% for item in items %}
            <li>{{ item.plato.nombre }} - Cantidad: {{ item.cantidad }} - Subtotal: ${{ item.plato.precio|floatformat:2 }}</li>
        {% endfor %}
    </ul>
    <h3>Total: ${{ total|floatformat:2 }}</h3>
    <button type="submit">Completar Pago</button>
</form>

</body>
</html>
