<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos de Ventas de Comida</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        canvas {
            max-width: 600px;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Gráficos de Ventas de Comida</h1>

    <h2>Gráfico de Tortas de Voto</h2>
    <canvas id="votoChart"></canvas>

    <h2>Gráfico de Barras de Pedidos</h2>
    <canvas id="pedidoChart"></canvas>

    <script>
        const votosData = {{ votos|safe }};
        console.log("Votos Data:", votosData);  // Verificar el contenido de votosData
        
        const pedidosData = {{ pedidos|safe }};
        console.log("Pedidos Data:", pedidosData);  // Verificar el contenido de pedidosData

        if (Array.isArray(votosData) && votosData.length > 0) {
            const votoLabels = votosData.map(voto => voto['plato_semanal__plato__nombre'] || 'Nombre Desconocido');
            const votoCounts = votosData.map(voto => voto.total || 0);

            const votoChart = new Chart(document.getElementById('votoChart'), {
                type: 'pie',
                data: {
                    labels: votoLabels,
                    datasets: [{
                        data: votoCounts,
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56'],
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        tooltip: {
                            callbacks: {
                                label: function(tooltipItem) {
                                    const label = tooltipItem.label || '';
                                    const value = tooltipItem.raw || 0;
                                    const total = votoCounts.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(2);
                                    return `${label}: ${value} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        } else {
            console.error("No hay datos para mostrar en el gráfico de votos.");
        }

        if (Array.isArray(pedidosData) && pedidosData.length > 0) {
            const pedidoLabels = pedidosData.map(pedido => pedido['plato__nombre']);
            const pedidoCounts = pedidosData.map(pedido => pedido['total_vendidos'] || 0); // Cambié 'total' a 'total_vendidos'

            const pedidoChart = new Chart(document.getElementById('pedidoChart'), {
                type: 'bar',
                data: {
                    labels: pedidoLabels,
                    datasets: [{
                        label: 'Total de Platos Vendidos', // Cambié el texto de la etiqueta
                        data: pedidoCounts,
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        } else {
            console.error("No hay datos para mostrar en el gráfico de pedidos.");
        }
    </script>
</body>
</html>
